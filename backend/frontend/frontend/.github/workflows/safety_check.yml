name: PWD Diagnostic Safety Protocol

# Trigger: Run this experiment every time we push code to the repository
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the code from the library
    - uses: actions/checkout@v2

    # Step 2: Set up the Python Environment (The Lab Bench)
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    # Step 3: Run the Diagnostic Script we wrote earlier
    - name: Run Battery Health Analysis
      run: |
        python backend/diagnostics.py
